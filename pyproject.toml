[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldroute"
version = "0.2.0"
description = "Planning and replanning routes for field engineers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
geodata = ["osmium==4.3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*", "demo/data/*.csv", "demo/data/*.json"]
